name: Debug analyze

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.txt
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            {
              echo "## flutter analyze output (exit $CODE)"
              echo '```'
              cat /tmp/analyze.txt
              echo '```'
            } > /tmp/comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          fi
          exit "$CODE"
